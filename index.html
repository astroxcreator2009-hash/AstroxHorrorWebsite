<!DOCTYPE html>
<html>
<head>
    <title>Astrox Horror Website</title>
    <link rel="icon" type="image/png" href="Images/Logo.png">
	<meta name="description" content="Astrox Website">

    <style>
        body {
			background-color: rgb(100, 100, 100);
			min-height: 100vh;
			margin: 0;
		}

        h1 {
            font-family: "Times New Roman", serif;
            font-size: 60px;
            text-align: center;
            color: rgb(0, 0, 0);
        }
		
		h2 {
            font-family: "Times New Roman", serif;
            font-size: 40px;
            text-align: center;
            color: rgb(0, 0, 0);
        }
		
		h3 {
			color: rgb(100, 100, 100);
			font-size: 40px;
			position: absolute;
			right: 10px;
			top: -30px;
		}
		
		.Box {
			border-radius: 20px;
			background-color: rgb(100,100,100);
			width: 60%;
			max-width: 1000px;
			min-width: 300px;
			height: 300px;

			margin: 50px auto; /* środek + odstęp */
		}

		.SeriesButton {
    		position: absolute;
    		top: 400px;
   			left: 100px;
			
    		background-color: rgb(80,80,80);

    		text-decoration: none;
			
    		padding: 15px 25px;
    		border-radius: 10px;
			
   			font-size: 30px;
		}

		.GamesButton {
			position: absolute;
    		top: 400px;
   			right: 100px;

		}

			border-radius: 20px;
			background-color: rgb(80,80,80);
			width: 60%;
			height: 600px;

			margin: 50px auto; /* odstęp i wyśrodkowanie */
		}
		
		.PlaylistText {
			font-size: 30px;
			margin-left: 10px;
		}
		
		.highlight {
			color: rgb(50, 50, 50);
		}
		
		.logo {
			display: block;
			margin: 20px auto;
			
			width: 35%;
			max-width: 800px;
			min-width: 180px;
			height: auto;
			
			border: 6px solid rgb(50,50,50);
		}
		::-webkit-scrollbar {
			width: 10px;
		}

		::-webkit-scrollbar-track {
			background: gray;
		}

		::-webkit-scrollbar-thumb {

}
